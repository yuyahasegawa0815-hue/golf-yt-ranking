name: daily-update

on:
  schedule:
    - cron: "47 20 * * *"   # 毎日 JST 5:47 にデータ取得とサイト更新
  workflow_dispatch:
    inputs:
      discover:
        description: "新しいチャンネルを検索して追加する"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_PROJECT: golf-yt-ranking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover new channels (毎週月曜 or 手動)
        run: |
          if [ "${{ github.event.inputs.discover }}" = "true" ] || [ "$(TZ=Asia/Tokyo date +%u)" = "1" ]; then
            python scripts/discover.py 2
          fi

      - name: Snapshot
        run: python scripts/snapshot.py

      - name: Build site
        run: python scripts/build.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Tokyo date +%F)"
          git push

      # --- 公開先: Cloudflare Pages（CLOUDFLARE_API_TOKEN が登録済みの場合） ---
      - name: Create Cloudflare Pages project (初回のみ・既存なら無視)
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.CF_PROJECT }} --production-branch=main
      - name: Deploy to Cloudflare Pages
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PROJECT }} --branch=main --commit-dirty=true

      # --- 公開先: GitHub Pages（Cloudflare 未設定時のみ） ---
      - if: env.CF_TOKEN == ''
        uses: actions/configure-pages@v5
      - if: env.CF_TOKEN == ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        if: env.CF_TOKEN == ''
        uses: actions/deploy-pages@v4
